[project]
name = "qsm-tdv"
version = "0.1.0"
description = "Energy-based Total Deep Variation for 3D quantitative susceptibility mapping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.15",
    "torch>=2.13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
tdv-qsm-train = "tdv_qsm.train:main"
tdv-qsm-gradient-baseline = "tdv_qsm.gradient_baseline:main"
tdv-qsm-evaluate-regularizers = "tdv_qsm.evaluate_regularizers:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
